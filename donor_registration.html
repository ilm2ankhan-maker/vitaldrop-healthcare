<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donor Registration - Blood Donation</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo">Blood Donation</div>
            <ul>
                <li><a href="./index.html">Home</a></li>
                <li><a href="./dashboard.html">Dashboard</a></li>
                <li><a href="./donor_registration.html" class="active">Donor Registration</a></li>
                <li><a href="./benefits_tips.html">Benefits & Tips</a></li>
                <li><a href="./jiya.html">Health Awareness</a></li>
                <li><a href="./predictive_analytics.html">Predictive Analytics</a></li>
                <li><a href="./health_monitoring.html">Health Monitoring</a></li>
                <li><a href="./reminders.html">Reminders</a></li>
                <li><a href="./patient_records.html">Patient Records</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="registration-form">
            <h2>Donor Registration</h2>
            <form id="donorForm" onsubmit="handleDonorRegistration(event)">
                <div class="form-group">
                    <label for="fullName">Full Name</label>
                    <input type="text" id="fullName" name="fullName" required>
                </div>

                <div class="form-group">
                    <label for="age">Age</label>
                    <input type="number" id="age" name="age" required min="18" max="65">
                </div>

                <div class="form-group">
                    <label for="bloodGroup">Blood Group</label>
                    <select id="bloodGroup" name="bloodGroup" required>
                        <option value="">Select Blood Group</option>
                        <option value="A+">A+</option>
                        <option value="A-">A-</option>
                        <option value="B+">B+</option>
                        <option value="B-">B-</option>
                        <option value="O+">O+</option>
                        <option value="O-">O-</option>
                        <option value="AB+">AB+</option>
                        <option value="AB-">AB-</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" name="phone" required>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="form-group">
                    <label for="address">Address</label>
                    <textarea id="address" name="address" required></textarea>
                </div>

                <button type="submit" class="submit-button">Register as Donor</button>
            </form>
        </section>

        <section class="view-donors">
            <button onclick="viewDonors()" class="view-donors-btn">View Registered Donors</button>
            <div id="donorsList"></div>
        </section>
    </main>

    <footer>
        <p>&copy; 2024 Blood Donation. All rights reserved.</p>
    </footer>

    <script src="scripts.js"></script>
</body>
</html>
